name: Diarios del país - monitor de medios

# Corre cada 30 minutos: baja los medios, actualiza la base y publica el tablero en GitHub Pages.
# La base vive en la rama "data-diarios" (comprimida), para no mezclar datos con código en main.
#
# Cada 30 minutos por AUTODISPARO: al terminar, el trabajo "encadenar" espera hasta completar 30 minutos desde el
# inicio de la corrida y relanza el workflow (workflow_dispatch). El cron de GitHub resulto muy irregular en este
# repo (ayer corrio 1 de cada 8 veces): queda solo como respaldo, para rearrancar la cadena si se corta.
on:
  schedule:
    # Dos veces por hora y lejos de la hora en punto: GitHub demora y a veces descarta las corridas
    # programadas en los momentos de mucha carga (sobre todo al comienzo de cada hora).
    # Si se descarta una, corre la otra; las notas repetidas se descartan solas.
    - cron: "23,53 * * * *"
  workflow_dispatch: {}       # boton "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths:
      - "diarios-del-pais/**"
      - ".github/workflows/diarios-del-pais.yml"

permissions:
  contents: write    # para guardar la base en la rama data-diarios
  pages: write       # para publicar el tablero
  id-token: write
  actions: write     # para que la corrida lance la siguiente (autodisparo)

env:
  TZ: America/Argentina/Buenos_Aires
  DATA_BRANCH: data-diarios

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # una sola corrida del pipeline a la vez (la concurrencia va aca y no en todo el workflow, para que la
    # espera del trabajo "encadenar" no frene a un push o a una corrida manual)
    concurrency:
      group: diarios-build
      cancel-in-progress: false
    defaults:
      run:
        working-directory: diarios-del-pais
    steps:
      - name: Codigo
        uses: actions/checkout@v4

      - name: Traer la base desde la rama de datos
        run: |
          mkdir -p "$GITHUB_WORKSPACE/datos"
          if git fetch --depth=1 origin "$DATA_BRANCH" 2>/dev/null; then
            git --work-tree="$GITHUB_WORKSPACE/datos" checkout FETCH_HEAD -- . || true
          fi
          cd "$GITHUB_WORKSPACE/datos"
          [ -f historico.db.gz ] && gunzip -f historico.db.gz || echo "primera corrida: base nueva"
          ls -la

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            diarios-del-pais/requirements.txt
            diarios-del-pais/requirements-bert.txt

      - run: pip install -r requirements.txt

      # BERT (XLM-RoBERTa) para el tono: torch para CPU + el modelo en cache para no bajarlo en cada corrida.
      # Si falla, build.py sigue con el modelo de tono anterior.
      - name: Dependencias de BERT
        run: pip install torch transformers sentencepiece protobuf --extra-index-url https://download.pytorch.org/whl/cpu || echo "sin BERT"

      # NER con spaCy (ner.py): el modelo en espanol se instala como wheel por pip, asi lo aprovecha la cache de pip.
      # Si falla, build.py sigue sin la columna ner. preshed 3.0.14 rompe la carga del modelo en Python 3.12
      # (OverflowError en el tokenizador): se fija la version anterior.
      - name: Dependencias de NER (spaCy)
        run: |
          if ! pip install "spacy>=3.8,<3.9" "preshed<3.0.14" "es_core_news_md @ https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" > /tmp/ner.log 2>&1; then
            echo "::warning title=NER::No se pudo instalar spaCy: $(grep -iE 'error|conflict' /tmp/ner.log | tail -n 3 | tr '\n' ' ' | cut -c1-500)"
          fi
          python -c "import spacy, es_core_news_md; print('spaCy', spacy.__version__, 'OK')" || echo "::warning title=NER::spaCy no se puede importar: $(python -c 'import spacy' 2>&1 | tail -n 1 | cut -c1-300)"

      # Cache de los modelos de Hugging Face: XLM-RoBERTa (tono) + MiniLM multilingue (notas parecidas, ver semantica.py).
      # La clave nombra los dos modelos: si se agrega o cambia un modelo, cambiar la clave para que se guarde una cache nueva.
      - name: Cache de los modelos (BERT y embeddings)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-xlmr-sentiment-minilm-multi-v2

      - name: Correr pipeline
        env:
          DATA_DIR: ${{ github.workspace }}/datos
          OUT_DIR: ${{ github.workspace }}/sitio
        run: python build.py

      - name: Armar el sitio
        run: |
          S="$GITHUB_WORKSPACE/sitio"
          cp "$S/rosario.html" "$S/index.html"
          cp "$GITHUB_WORKSPACE/datos/historico.db" "$GITHUB_WORKSPACE/datos/historico.csv" "$S/"
          # emb.bin (embeddings de las notas para "Buscar por significado") lo escribe build.py directo en OUT_DIR
          [ -f "$S/emb.bin" ] || echo "::warning::sin emb.bin: la busqueda por significado del tablero no va a funcionar"
          touch "$S/.nojekyll"
          ls -la "$S"

      - name: Guardar la base en la rama de datos (un solo commit, sin historia)
        run: |
          cd "$GITHUB_WORKSPACE/datos"
          gzip -kf historico.db
          TAM=$(stat -c %s historico.db.gz); echo "base comprimida: $((TAM/1024/1024)) MB"
          if [ "$TAM" -gt 94371840 ]; then echo "::error::La base comprimida supera 90 MB (limite de GitHub: 100 MB). Bajar RETENCION_DIAS en build.py."; exit 1; fi
          rm -rf .git && git init -q && git checkout -q -b "$DATA_BRANCH"
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add historico.db.gz
          git commit -q -m "datos $(date +%Y-%m-%dT%H:%M%z)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$DATA_BRANCH"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: diarios-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Autodisparo: espera hasta completar 30 minutos desde el inicio de esta corrida y lanza la siguiente.
  # - Corre aunque el pipeline haya fallado (always), asi la cadena no se corta por un error puntual.
  # - Una sola cadena: la corrida mas nueva es la duena. Si mientras se espera aparecio otra (push, cron o manual),
  #   esta no lanza nada y la cadena sigue desde la nueva.
  # - Solo en main. Si la cadena se corta (p. ej. una caida de GitHub), el cron o el proximo push la rearrancan.
  encadenar:
    needs: [build, deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Esperar y lanzar la proxima corrida
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PERIODO: "1800"
        run: |
          creada=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .created_at)
          espera=$(( PERIODO - ($(date +%s) - $(date -d "$creada" +%s)) ))
          [ "$espera" -lt 60 ] && espera=60
          echo "corrida creada $creada; espero $espera s para completar $((PERIODO/60)) minutos"
          sleep "$espera"
          nuevas=$(gh api "repos/$REPO/actions/workflows/diarios-del-pais.yml/runs?per_page=30"                    --jq "[.workflow_runs[] | select(.id != $RUN_ID and .created_at > \"$creada\")] | length")
          if [ "$nuevas" -gt 0 ]; then
            echo "hay $nuevas corrida(s) mas nuevas: la cadena sigue desde ellas"
            exit 0
          fi
          gh workflow run diarios-del-pais.yml --repo "$REPO" --ref main
          echo "proxima corrida lanzada"
