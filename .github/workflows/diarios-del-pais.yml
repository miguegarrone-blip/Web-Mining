name: Diarios del país - monitor de medios

# Corre cada hora: baja los medios, actualiza la base y publica el tablero en GitHub Pages.
# La base vive en la rama "data-diarios" (comprimida), para no mezclar datos con código en main.
on:
  schedule:
    # Dos veces por hora y lejos de la hora en punto: GitHub demora y a veces descarta las corridas
    # programadas en los momentos de mucha carga (sobre todo al comienzo de cada hora).
    # Si se descarta una, corre la otra; las notas repetidas se descartan solas.
    - cron: "23,53 * * * *"
  workflow_dispatch: {}       # boton "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths:
      - "diarios-del-pais/**"
      - ".github/workflows/diarios-del-pais.yml"

permissions:
  contents: write    # para guardar la base en la rama data-diarios
  pages: write       # para publicar el tablero
  id-token: write

concurrency:
  group: diarios-del-pais
  cancel-in-progress: false

env:
  TZ: America/Argentina/Buenos_Aires
  DATA_BRANCH: data-diarios

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: diarios-del-pais
    steps:
      - name: Codigo
        uses: actions/checkout@v4

      - name: Traer la base desde la rama de datos
        run: |
          mkdir -p "$GITHUB_WORKSPACE/datos"
          if git fetch --depth=1 origin "$DATA_BRANCH" 2>/dev/null; then
            git --work-tree="$GITHUB_WORKSPACE/datos" checkout FETCH_HEAD -- . || true
          fi
          cd "$GITHUB_WORKSPACE/datos"
          [ -f historico.db.gz ] && gunzip -f historico.db.gz || echo "primera corrida: base nueva"
          ls -la

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            diarios-del-pais/requirements.txt
            diarios-del-pais/requirements-bert.txt

      - run: pip install -r requirements.txt

      # BERT (XLM-RoBERTa) para el tono: torch para CPU + el modelo en cache para no bajarlo en cada corrida.
      # Si falla, build.py sigue con el modelo de tono anterior.
      - name: Dependencias de BERT
        run: pip install torch transformers sentencepiece protobuf --extra-index-url https://download.pytorch.org/whl/cpu || echo "sin BERT"

      - name: Cache del modelo BERT
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-xlm-roberta-sentiment-v1

      - name: Correr pipeline
        env:
          DATA_DIR: ${{ github.workspace }}/datos
          OUT_DIR: ${{ github.workspace }}/sitio
        run: python build.py

      - name: Armar el sitio
        run: |
          S="$GITHUB_WORKSPACE/sitio"
          cp "$S/rosario.html" "$S/index.html"
          cp "$GITHUB_WORKSPACE/datos/historico.db" "$GITHUB_WORKSPACE/datos/historico.csv" "$S/"
          touch "$S/.nojekyll"
          ls -la "$S"

      - name: Guardar la base en la rama de datos (un solo commit, sin historia)
        run: |
          cd "$GITHUB_WORKSPACE/datos"
          gzip -kf historico.db
          TAM=$(stat -c %s historico.db.gz); echo "base comprimida: $((TAM/1024/1024)) MB"
          if [ "$TAM" -gt 94371840 ]; then echo "::error::La base comprimida supera 90 MB (limite de GitHub: 100 MB). Bajar RETENCION_DIAS en build.py."; exit 1; fi
          rm -rf .git && git init -q && git checkout -q -b "$DATA_BRANCH"
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add historico.db.gz
          git commit -q -m "datos $(date +%Y-%m-%dT%H:%M%z)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$DATA_BRANCH"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
